<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBlob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDECEF"/>
      <stop offset="100%" stop-color="#FFF5F6"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D62839"/>
      <stop offset="100%" stop-color="#A4162A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#18212F" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Organic Background Blob -->
  <path d="M480,120 C540,200 560,340 490,410 C420,480 270,490 170,440 C70,390 40,270 90,170 C140,70 320,40 480,120 Z" fill="url(#bgBlob)"/>

  <!-- Pulse / ECG Line subtle in background -->
  <path d="M50,260 L180,260 L205,210 L230,310 L260,180 L290,290 L315,245 L340,260 L550,260" fill="none" stroke="#F87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Central Blood Bag Illustration -->
  <g transform="translate(230, 90)">
    <!-- Hanging Loop -->
    <path d="M60,0 C60,0 70,-20 85,-20 C100,-20 110,0 110,0" fill="none" stroke="#94A3B8" stroke-width="4"/>
    <!-- Bag Container -->
    <rect x="25" y="0" width="120" height="190" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" filter="url(#cardShadow)"/>
    <!-- Blood Liquid Inside -->
    <path d="M30,80 Q85,70 140,80 L140,165 C140,178 130,187 117,187 L53,187 C40,187 30,178 30,165 Z" fill="url(#redGrad)"/>
    <!-- Liquid Highlight -->
    <path d="M42,95 Q55,90 70,95" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Label on Bag -->
    <rect x="45" y="25" width="80" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="85" y="44" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#D62839" text-anchor="middle">O+</text>
    <text x="85" y="58" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#64748B" text-anchor="middle">TESTED &amp; SAFE</text>
    <!-- Tube -->
    <path d="M85,190 C85,230 40,240 40,300" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <path d="M85,190 C85,230 40,240 40,300" fill="none" stroke="#D62839" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Left Floating Card: Fast Response -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <rect width="180" height="74" rx="16" fill="#FFFFFF"/>
    <circle cx="38" cy="37" r="20" fill="#FDECEF"/>
    <path d="M38,28 L38,38 L45,42" fill="none" stroke="#D62839" stroke-width="2.5" stroke-linecap="round"/>
    <text x="68" y="32" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#18212F">24/7 Dispatch</text>
    <text x="68" y="48" font-family="'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#64748B">Instant Allocation</text>
  </g>

  <!-- Right Floating Card: Verified Safety -->
  <g transform="translate(360, 260)" filter="url(#cardShadow)">
    <rect width="180" height="74" rx="16" fill="#FFFFFF"/>
    <circle cx="38" cy="37" r="20" fill="#DCFCE7"/>
    <path d="M30,37 L36,43 L47,30" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="32" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#18212F">100% Tested</text>
    <text x="68" y="48" font-family="'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#64748B">Sterile &amp; Screened</text>
  </g>

  <!-- Bottom Floating Card: Lives Saved -->
  <g transform="translate(140, 360)" filter="url(#cardShadow)">
    <rect width="210" height="78" rx="16" fill="#FFFFFF"/>
    <circle cx="40" cy="39" r="22" fill="#FDECEF"/>
    <path d="M40,30 C40,30 32,38 32,43 C32,47 35,50 40,50 C45,50 48,47 48,43 C48,38 40,30 40,30 Z" fill="#D62839"/>
    <text x="74" y="34" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#D62839">1 Unit = 3 Lives</text>
    <text x="74" y="52" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748B">Red Cross Standard</text>
  </g>
</svg>
